
    <app-page-header title="Partenaires financiers" subtitle="Banques, microfinances, ONG et investisseurs référencés">
      <a routerLink="nouveau" class="btn btn-primary">+ Nouveau partenaire</a>
    </app-page-header>

    <app-data-table [columns]="columns" [rows]="rows()" [loading]="loading()" emptyTitle="Aucun partenaire" [rowActionsTemplate]="actionsTpl" />

    <ng-template #actionsTpl let-row>
      <a class="btn btn-outline btn-sm" [routerLink]="['/financements']" [queryParams]="{ idPartenaire: row.idPartenaire }">Financements</a>
      <a class="btn btn-outline btn-sm" [routerLink]="[row.idPartenaire, 'modifier']">Modifier</a>
      <button class="btn btn-danger btn-sm" (click)="remove(row)">Supprimer</button>
    </ng-template>
