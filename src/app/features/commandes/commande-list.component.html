
    <app-page-header title="Commandes" subtitle="Suivez les commandes de produits agricoles et d’intrants" />

    <app-data-table class="commande-table" [columns]="columns" [rows]="rows()" [loading]="loading()" emptyTitle="Aucune commande" [rowActionsTemplate]="actionsTpl" />

    <ng-template #actionsTpl let-row>
      <a class="btn btn-outline btn-sm" [routerLink]="[row.idCommande]">Détails</a>
      <button class="btn btn-danger btn-sm" (click)="remove(row)">Supprimer</button>
    </ng-template>
