
    <app-page-header title="Mon profil" subtitle="Ces informations sont visibles par les administrateurs et sur vos publications" />

    @if (loading()) {
      <app-loading-spinner />
    } @else {
      <div class="status-banner card" [class]="'status-banner--' + statutTone()">
        <span>Statut de validation :</span>
        <app-status-badge [label]="statutLabel()" [tone]="statutTone()" />
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" class="card form-card">
        <div class="field">
          <label>Photo de profil</label>
          <app-file-upload folder="profils" [initialUrl]="form.controls.photoProfil.value" (uploaded)="form.patchValue({ photoProfil: $event })" />
        </div>

        <div class="grid-2">
          <div class="field">
            <label>Nom</label>
            <input class="input" formControlName="nom" [class.invalid]="isInvalid('nom')" />
          </div>
          <div class="field">
            <label>Prénom</label>
            <input class="input" formControlName="prenom" [class.invalid]="isInvalid('prenom')" />
          </div>
        </div>

        <div class="grid-2">
          <div class="field">
            <label>Téléphone</label>
            <input class="input" formControlName="telephone" [class.invalid]="isInvalid('telephone')" />
          </div>
          <div class="field">
            <label>Localisation</label>
            <input class="input" formControlName="localisation" [class.invalid]="isInvalid('localisation')" />
          </div>
        </div>

        <div class="field">
          <label>Nom de l'entreprise</label>
          <input class="input" formControlName="nomEntreprise" />
        </div>

        <div class="field">
          <label>Zone de vente</label>
          <input class="input" formControlName="zoneDeVente" />
        </div>

        <div class="field">
          <label>Description de votre activité</label>
          <textarea class="textarea" formControlName="description"></textarea>
        </div>

        <button type="submit" class="btn btn-primary" [disabled]="saving()">
          {{ saving() ? 'Enregistrement...' : 'Enregistrer les modifications' }}
        </button>
      </form>
    }
