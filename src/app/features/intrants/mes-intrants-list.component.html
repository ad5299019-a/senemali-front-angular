
    <app-page-header title="Mes intrants" subtitle="Publiez vos semences, engrais ou produits vétérinaires. Chaque nouvel intrant doit être validé par un administrateur.">
      <a routerLink="nouveau" class="btn btn-primary">+ Nouvel intrant</a>
    </app-page-header>

    <app-data-table [columns]="columns" [rows]="rows()" [loading]="loading()" emptyTitle="Vous n'avez publié aucun intrant" [rowActionsTemplate]="actionsTpl" />

    <ng-template #actionsTpl let-row>
      <a class="btn btn-outline btn-sm" [routerLink]="[row.idIntrant, 'modifier']">Modifier</a>
      <button class="btn btn-danger btn-sm" (click)="remove(row)">Supprimer</button>
    </ng-template>
