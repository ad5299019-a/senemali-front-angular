<div class="intrant-form-page">
  <!-- En-tête -->
  <header class="page-header">
    <h1 class="page-title">Intrants</h1>
    <p class="page-subtitle">Gérer votre catalogue de produits agricoles</p>
  </header>

  <!-- Formulaire dans un conteneur blanc fidèle au Figma -->
  <div class="card form-card">
    <h2 class="form-section-title">Information du produit</h2>

    <form [formGroup]="form" (ngSubmit)="submit()" class="form-content">
      <div class="form-grid">
        <!-- Colonne gauche -->
        <div class="form-col">
          <div class="field-wrap">
            <input
              type="text"
              class="form-input"
              formControlName="nomIntrant"
              placeholder="Nom du produit"
              [class.invalid]="isInvalid('nomIntrant')"
            />
          </div>

          <div class="field-wrap">
            <textarea
              class="form-input form-textarea"
              formControlName="description"
              placeholder="Description"
            ></textarea>
          </div>

          <div class="field-wrap">
            <input
              type="number"
              class="form-input"
              formControlName="prix"
              placeholder="Prix"
              [class.invalid]="isInvalid('prix')"
            />
          </div>

          <div class="field-wrap">
            <input
              type="text"
              class="form-input"
              formControlName="localisation"
              placeholder="Localisation"
            />
          </div>
        </div>

        <!-- Colonne droite -->
        <div class="form-col">
          <!-- Zone d'upload d'image -->
          <div class="upload-box" [class.has-preview]="!!previewUrl()">
            @if (previewUrl(); as preview) {
              <div class="preview-wrap">
                <img [src]="preview" alt="Aperçu" class="preview-img" />
                <button type="button" class="btn-remove-preview" (click)="removeImage()" title="Supprimer l'image">
                  <mat-icon>close</mat-icon>
                </button>
              </div>
            } @else {
              <label class="upload-dropzone">
                <input type="file" accept="image/*" hidden (change)="onFileSelected($event)" />
                <mat-icon class="upload-icon">upload</mat-icon>
                <span class="upload-title">Cliquez pour ajouter une image</span>
                <span class="upload-subtitle">PNG, JPG...</span>
                @if (uploading()) {
                  <span class="uploading-indicator">Envoi en cours...</span>
                }
              </label>
            }
          </div>

          <div class="field-wrap">
            <input
              type="text"
              class="form-input"
              formControlName="typeIntrant"
              placeholder="Type"
              [class.invalid]="isInvalid('typeIntrant')"
            />
          </div>

          <div class="field-wrap">
            <input
              type="text"
              class="form-input"
              formControlName="unite"
              placeholder="Unité"
            />
          </div>

          <div class="field-wrap">
            <input
              type="number"
              class="form-input"
              formControlName="quantite"
              placeholder="Quantité disponible"
            />
          </div>
        </div>
      </div>

      <!-- Boutons d'action -->
      <footer class="form-actions">
        <a routerLink="/mes-intrants" class="btn-cancel">Annuler</a>
        <button type="submit" class="btn-submit" [disabled]="saving()">
          {{ saving() ? 'En cours...' : (isEdit() ? 'Modifier' : 'Ajouter le produit') }}
        </button>
      </footer>
    </form>
  </div>
</div>
