
    <app-page-header title="Prestataires" subtitle="Conseillers et techniciens agricoles référencés">
      <a routerLink="nouveau" class="btn btn-primary">+ Nouveau prestataire</a>
    </app-page-header>

    <app-data-table [columns]="columns" [rows]="rows()" [loading]="loading()" emptyTitle="Aucun prestataire" [rowActionsTemplate]="actionsTpl" />

    <ng-template #actionsTpl let-row>
      <a class="btn btn-outline btn-sm" [routerLink]="['/services-agricoles']" [queryParams]="{ idPrestataire: row.idPrestataire }">Services</a>
      <a class="btn btn-outline btn-sm" [routerLink]="[row.idPrestataire, 'modifier']">Modifier</a>
      <button class="btn btn-danger btn-sm" (click)="remove(row)">Supprimer</button>
    </ng-template>
