
    <div class="toast-stack" aria-live="polite">
      @for (toast of toastService.toasts(); track toast.id) {
        <div [class]="'toast toast--' + toast.kind">
          <span class="toast__icon">
            @switch (toast.kind) {
              @case ('success') { ✓ }
              @case ('error') { ✕ }
              @case ('warning') { ! }
              @default { i }
            }
          </span>
          <span class="toast__message">{{ toast.message }}</span>
          <button class="toast__close" type="button" (click)="toastService.dismiss(toast.id)" aria-label="Fermer la notification">×</button>
        </div>
      }
    </div>
