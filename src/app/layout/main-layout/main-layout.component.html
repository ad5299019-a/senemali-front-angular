
    <div class="shell">
      <aside class="sidebar" [class.sidebar--open]="mobileOpen()">
        <div class="brand">
          <img class="brand__logo" src="/logoBlancSecondaire.png" alt="SeneMali" />
          <div>
            <p class="brand__name">SeneMali</p>
            <p class="brand__role">{{ roleLabel() }}</p>
          </div>
        </div>

        <nav class="nav">
          @for (item of visibleItems(); track item.path) {
            <a [routerLink]="item.path" routerLinkActive="active" class="nav-item" (click)="mobileOpen.set(false)">
              <mat-icon class="nav-item__icon" aria-hidden="true">{{ item.icon }}</mat-icon>
              <span>{{ item.label }}</span>
            </a>
          }
        </nav>

        <button class="logout" type="button" (click)="confirmLogout()">
          <mat-icon aria-hidden="true">logout</mat-icon> Se déconnecter
        </button>
      </aside>

      @if (mobileOpen()) {
        <div class="backdrop" (click)="mobileOpen.set(false)"></div>
      }

      <div class="main">
        <header class="topbar">
          <button class="burger" aria-label="Ouvrir le menu" (click)="mobileOpen.set(true)">
            <mat-icon>menu</mat-icon>
          </button>
          <div class="spacer"></div>
          <a class="notifications" [routerLink]="notificationPath()" aria-label="Notifications">
            <mat-icon>notifications</mat-icon>
          </a>
          <div class="user">
            <div class="user__avatar">{{ initials() }}</div>
            <div class="user__info">
              <p class="user__name">{{ auth.currentUser()?.prenom }} {{ auth.currentUser()?.nom }}</p>
              <p class="user__email text-subtle">{{ auth.currentUser()?.identifiant }}</p>
            </div>
          </div>
        </header>
        <main class="content">
          <router-outlet />
        </main>
      </div>
    </div>
